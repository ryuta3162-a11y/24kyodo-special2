<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYFIT24経堂 | お得な入会キャンペーン</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="i18n.css">
    
    <style>
        :root {
            --page-bg: #FFFFFF;
            --brand-red: #C21632;
            --brand-red-dark: #8a0e20;
            --ink: #111111;
            --muted: #555555;
            --line: #E5E5E5;
            --radius: 0.35rem;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            color: var(--ink);
            background-color: var(--page-bg);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .text-brand-red { color: var(--brand-red); }
        .bg-brand-red { background-color: var(--brand-red); }
        .hover\:bg-brand-red-dark:hover { background-color: var(--brand-red-dark); }

        .hero {
            text-align: center;
            padding: 3.5rem 1rem 1.75rem;
        }
        .hero-brand {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: var(--ink);
            margin-bottom: 1.1rem;
        }
        .hero-title-black {
            margin: 0;
            font-size: clamp(1.45rem, 4.8vw, 2rem);
            font-weight: 900;
            line-height: 1.35;
            color: var(--ink);
        }
        .hero-title-red {
            margin: 0.35rem 0 0;
            font-size: clamp(1.55rem, 5.2vw, 2.15rem);
            font-weight: 900;
            line-height: 1.3;
            color: var(--brand-red);
        }
        .hero-rule {
            width: 100%;
            max-width: 64rem;
            height: 4px;
            margin: 1.35rem auto 0;
            background: var(--brand-red);
            border: none;
        }

        .campaign-grid {
            max-width: 64rem;
            margin: 0 auto;
            padding: 0 1rem 3rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .campaign-grid { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
        }

        .campaign-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--line);
            border-top: 4px solid var(--brand-red);
            border-radius: var(--radius);
            padding: 1.5rem 1.25rem 1.25rem;
            text-align: center;
        }
        .card-badge {
            display: inline-block;
            margin: 0 auto 0.75rem;
            padding: 0.2rem 0.7rem;
            background: var(--ink);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            border-radius: 0.2rem;
        }
        .card-title {
            margin: 0 0 1.25rem;
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--ink);
            line-height: 1.4;
        }
        .offer-block {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 1rem 0.5rem;
            margin-bottom: 1.25rem;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }
        .offer-lead {
            margin: 0 0 0.35rem;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
        }
        .offer-note {
            margin: 0.75rem 0 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: #888;
        }
        .cta-button {
            display: block;
            width: 100%;
            padding: 0.95rem 1rem;
            background: var(--brand-red);
            color: #fff;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.04em;
            text-align: center;
            border-radius: var(--radius);
            transition: background-color 0.15s ease;
            text-decoration: none;
        }
        .cta-button:hover {
            background-color: var(--brand-red-dark);
            color: #fff;
        }

        .site-footer-bar {
            border-top: 1px solid var(--line);
            padding: 1.25rem 1rem 2rem;
        }
        .footer-text {
            margin: 0;
            text-align: center;
            color: var(--ink);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body class="antialiased">

    <div class="lang-switcher" id="lang-switcher">
        <button type="button" class="lang-switcher__btn" id="lang-toggle" aria-expanded="false" aria-haspopup="listbox">
            <span class="lang-switcher__current" id="lang-current">日本語</span>
            <span aria-hidden="true">▼</span>
        </button>
        <div class="lang-switcher__menu" id="lang-menu" role="listbox" aria-label="Language">
            <button type="button" class="lang-switcher__item is-active" data-lang="ja" role="option">日本語</button>
            <button type="button" class="lang-switcher__item" data-lang="en" role="option">English</button>
            <button type="button" class="lang-switcher__item" data-lang="zh-CN" role="option">简体中文</button>
            <button type="button" class="lang-switcher__item" data-lang="zh-TW" role="option">繁體中文</button>
            <button type="button" class="lang-switcher__item" data-lang="ko" role="option">한국어</button>
        </div>
    </div>

    <header class="hero">
        <p class="hero-brand">JOYFIT24 経堂</p>
        <h1 class="hero-title-black" data-i18n="hero.lineBlack">入会をもっとお得に</h1>
        <p class="hero-title-red" data-i18n="hero.lineRed">追加特典はこちらから</p>
        <hr class="hero-rule">
    </header>

    <main id="campaigns">
        <div class="campaign-grid">

                <div class="campaign-card">
                    <span class="card-badge" data-i18n="card1.badge">特典 01</span>
                    <h3 class="card-title" data-i18n="card1.title">お友達紹介キャンペーン</h3>
                    <div class="offer-block">
                        <p class="offer-lead" data-i18n="card1.lead">紹介者・入会者どちらも</p>
                        <div class="flex items-baseline justify-center text-brand-red my-1">
                            <span class="text-4xl font-black">1,000</span>
                            <span class="text-xl font-bold ml-1">pt</span>
                        </div>
                        <p class="text-base font-bold" data-i18n="card1.points">Enjoyポイントプレゼント</p>
                        <p class="offer-note" data-i18n="card1.note">※新規入会者限定</p>
                    </div>
                    <a href="referral_form.html" class="cta-button" data-i18n="card1.cta">専用フォームから申請</a>
                </div>

                <div class="campaign-card">
                    <span class="card-badge" data-i18n="card2.badge">特典 02</span>
                    <h3 class="card-title" data-i18n="card2.title">学校関係者割</h3>
                    <div class="offer-block">
                        <div class="grid grid-cols-2 divide-x" style="border-color: var(--line);">
                            <div class="px-1">
                                <p class="text-xs font-bold" style="color: var(--muted);" data-i18n="card2.student">学生</p>
                                <div class="my-1">
                                    <p class="text-xl font-bold text-brand-red leading-tight">7,150円</p>
                                    <p class="text-[10px] text-brand-red font-bold" data-i18n="card2.tax">(税込)</p>
                                </div>
                                <p class="text-[10px] font-bold" style="color:#888;" data-i18n="card2.studentDiscount">2,200円引</p>
                            </div>
                            <div class="px-1">
                                <p class="text-xs font-bold" style="color: var(--muted);" data-i18n="card2.faculty">教職員</p>
                                <div class="my-1">
                                    <p class="text-xl font-bold leading-tight">8,250円</p>
                                    <p class="text-[10px] font-bold" style="color: var(--muted);" data-i18n="card2.tax">(税込)</p>
                                </div>
                                <p class="text-[10px] font-bold" style="color:#888;" data-i18n="card2.facultyDiscount">1,100円引</p>
                            </div>
                        </div>
                        <p class="offer-note" data-i18n="card2.note">※新規入会者限定</p>
                    </div>
                    <a href="https://forms.gle/PCrYhsMrFGtQocZe6" target="_blank" rel="noopener noreferrer" class="cta-button" data-i18n="card2.cta">専用フォームから申請</a>
                </div>

                <div class="campaign-card">
                    <span class="card-badge" data-i18n="card3.badge">特典 03</span>
                    <h3 class="card-title" data-i18n="card3.title">他クラブ乗り換え割</h3>
                    <div class="offer-block">
                        <div class="flex items-baseline justify-center w-full">
                            <span class="text-lg font-bold mr-2" data-i18n="card3.nextMonth">翌月会費が</span>
                            <span class="text-4xl font-black text-brand-red">0</span>
                            <span class="text-xl font-bold ml-1" data-i18n="card3.yen">円に！</span>
                        </div>
                        <p class="offer-note" data-i18n="card3.note">※新規入会者限定</p>
                    </div>
                    <a href="transfer_form.html" class="cta-button" data-i18n="card3.cta">専用フォームから申請</a>
                </div>

        </div>
    </main>

    <footer class="site-footer-bar"><p class="footer-text">JOYFIT24 経堂</p></footer>
<script src="locales.bundle.js"></script>
    <script src="i18n.js"></script>
    <script>JoyfitI18n.init('index');</script>
</body>
</html>
